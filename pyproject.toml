[project]
name = "shoppa"
version = "0.1.0"
description = "Phone-first shopping list: tap a pending item to tick it off, tap a previous entry to put it back on the list."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
shoppa = "shoppa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "shoppa",
]

[tool.setuptools.package-data]
shoppa = ["templates/**/*.html", "static/**/*"]
